<!DOCTYPE html>
<html>

<head>

    <title>AI Chatbot</title>

    <link rel="stylesheet"
    href="{{ url_for('static',
    filename='css/style.css') }}">

</head>

<body>

<h1>Sustainable Diet AI Chatbot</h1>

<form action="/chatbot" method="POST">

    <input type="text"
    name="message"
    placeholder="Ask something..."
    required>

    <br><br>

    <button type="submit">Send</button>

</form>

{% if response %}

<h3>Bot Response:</h3>

<p>{{ response }}</p>

{% endif %}

</body>

</html>
