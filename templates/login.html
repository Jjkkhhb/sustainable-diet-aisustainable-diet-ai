<!DOCTYPE html>
<html>

<head>
    <title>Login</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<h1>User Login</h1>

<form action="/login" method="POST">

    <input type="text"
    name="username"
    placeholder="Enter Username">

    <br><br>

    <input type="password"
    name="password"
    placeholder="Enter Password">

    <br><br>

    <button type="submit">Login</button>
    <br><br>

<a href="/register">
Create New Account
</a>

</form>

</body>

</html>
