<!DOCTYPE html>
<html>

<head>
    <title>Result</title>
    <link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <h1>Your BMI Result</h1>

    <h2>{{ bmi }}</h2>
    <h3>Sustainability Score</h3>

<p>{{ score }}</p>
    
    <h3>Recommended Foods</h3>

<h3>Recommended Foods</h3>

{% for food in foods %}

<div style="
background:white;
padding:15px;
margin:15px;
border-radius:10px;
">

    <h4>{{ food.Food }}</h4>

    <p>Calories: {{ food.Calories }}</p>

    <p>Protein: {{ food.Protein }} g</p>

    <p>Sustainability: {{ food.Sustainability }}</p>

</div>

{% endfor %}

    <a href="/">Go Back</a>

</body>

</html>
